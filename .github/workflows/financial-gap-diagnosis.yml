name: A-Share Financial Gap Diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/one-shot/finance-gap-diagnosis-20261124.txt']
permissions:
  contents: read
concurrency:
  group: a-share-data-pipeline
  queue: max
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: backend
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r backend/requirements.txt
          pip install 'boto3>=1.35,<2'
      - name: Read-only comparison of backlog, DATA_GAP and verified financial archives
        run: python -m value_screener.financial_gap_diagnosis
