name: A-Share Historical ST - BaoStock

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Newest completed year
        required: true
        default: '2025'
        type: string
      end_year:
        description: Oldest completed year
        required: true
        default: '2020'
        type: string
      probe_only:
        description: Check BaoStock without collecting full history
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/one-shot/historical-st-baostock-094-full-20261124.txt'

permissions:
  contents: read

concurrency:
  group: a-share-historical-st-baostock
  cancel-in-progress: false

jobs:
  historical-st:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: backend
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}
      START_YEAR: ${{ inputs.start_year || '2025' }}
      END_YEAR: ${{ inputs.end_year || '2020' }}
      PROBE_ONLY: ${{ inputs.probe_only || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private archive and BaoStock dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install 'duckdb>=1.3,<2' 'boto3>=1.35,<2' 'baostock==0.9.4'
          python -c "from importlib.metadata import version; assert version('baostock') == '0.9.4'; print('BAOSTOCK_VERSION', version('baostock'))"
      - name: Verify ST reconciliation rules
        run: |
          python - <<'PY'
          from value_screener.phase2_historical_st import *
          assert name_status('＊ＳＴ示例') == 1
          assert name_status('S*ST示例') == 1
          assert name_status('示例股份') == 0
          assert resolve(1,0) == (None,'conflict')
          assert resolve(None,None) == (None,'unknown')
          assert resolve(0,None) == (0,'baostock_only')
          assert resolve(None,1) == (1,'namechange_only')
          assert resolve(1,1) == (1,'both_agree')
          periods=intervals([dict(name='*ST示例',start_date='20200101',end_date=None),
                             dict(name='示例',start_date='20200501',end_date=None)])
          assert name_evidence(periods,'2019-12-31')[0] is None
          assert name_evidence(periods,'2020-04-30')[0] == 1
          assert name_evidence(periods,'2020-05-01')[0] == 0
          conflict=intervals([dict(name='ST示例',start_date='20200101',end_date='20200601'),
                              dict(name='示例',start_date='20200501',end_date=None)])
          assert name_evidence(conflict,'2020-05-15')[3] is True
          print('ST_RULE_TESTS passed')
          PY
      - name: Collect and verify BaoStock ST archive
        shell: bash
        run: |
          set -euo pipefail
          args=(--source baostock --start-year "$START_YEAR" --end-year "$END_YEAR")
          if [[ "$PROBE_ONLY" == "true" ]]; then args+=(--probe-only); fi
          python -m value_screener.phase2_historical_st "${args[@]}"
