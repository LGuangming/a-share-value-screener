# One-time dispatcher created at the user's request on 2026-11-23.
# Runs only when this file is changed in a matching one-time commit.
# Dispatches the canonical workflow; does not duplicate stock-ingestion logic.
name: One-time A-share scan dispatcher
on:
  push:
    paths:
      - ".github/workflows/one-time-scan-dispatch.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'chore: dispatch daily A-share scan 2026-11-23' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical A-share scanner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run daily-scan.yml --ref main -f financial_budget=30
