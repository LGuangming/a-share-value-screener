name: A-Share Raw Data Maintenance
on:
  workflow_run:
    workflows: [A-Share Raw Market Incremental Archive]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply verified retention cleanup (false = audit only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: a-share-data-pipeline
  queue: max
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: backend
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APPLY_CLEANUP: ${{ (github.event_name == 'workflow_run' || inputs.apply == true) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test maintenance dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install 'boto3>=1.35,<2'
          python -m unittest discover -s backend/tests -p test_raw_maintenance.py -v
      - name: Check archives, record capacity, and apply gated retention
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APPLY_CLEANUP" = "true" ]; then
            python -m value_screener.raw_maintenance --apply
          else
            python -m value_screener.raw_maintenance
          fi
