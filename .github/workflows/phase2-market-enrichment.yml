name: A-Share Phase 2 Market Enrichment

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Newest complete year'
        required: true
        default: '2025'
        type: string
      end_year:
        description: 'Oldest year'
        required: true
        default: '2020'
        type: string
      datasets:
        description: 'Comma-separated datasets (validated allowlist)'
        required: true
        default: 'adj_factor,stk_limit,daily_basic,suspend_d'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/one-shot/phase2-market-start-20261123.txt'

permissions:
  contents: read

# Serialize with the phase-1 archive and API permission checks. No parallel API calls.
concurrency:
  group: a-share-backtest-history
  cancel-in-progress: false

jobs:
  backfill-market:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: backend
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_API_SOURCE: official
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install phase-2 archive requirements
        run: |
          pip install -r backend/requirements.txt
          pip install 'duckdb>=1.3,<2' 'boto3>=1.35,<2'
      - name: Restore/verify existing monthly partitions or fetch missing market data
        run: |
          python -m value_screener.phase2_market \
            --start-year "${{ inputs.start_year || '2025' }}" \
            --end-year "${{ inputs.end_year || '2020' }}" \
            --datasets "${{ inputs.datasets || 'adj_factor,stk_limit,daily_basic,suspend_d' }}"
