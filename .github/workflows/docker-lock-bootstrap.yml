name: Docker dependency lock bootstrap
on:
  push:
    branches: [feature/vps-docker-compose]
permissions:
  contents: read
jobs:
  lock:
    if: github.repository == 'LGuangming/a-share-value-screener'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency lock without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export lock bytes (public package metadata only)
        run: |
          sha256sum package-lock.json
          python - <<'PY'
          import base64,pathlib
          data=base64.b64encode(pathlib.Path("package-lock.json").read_bytes()).decode()
          for i in range(0,len(data),3000):
              print("LOCK_CHUNK:"+str(i//3000)+":"+data[i:i+3000])
          print("LOCK_END:"+str((len(data)+2999)//3000))
          PY
