name: Reviewed Web + Minimal pair acceptance (no publication permission)
on:
  workflow_call:
    inputs:
      confirm:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REVIEWED_SHA: cf928feb8463abf240356dbb381a6348fc716902
  REVIEWED_RUN: '45630877479'
jobs:
  resolve-base-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      node: ${{ steps.resolve.outputs.node }}
      python: ${{ steps.resolve.outputs.python }}
      web_runtime: ${{ steps.resolve.outputs.web_runtime }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Authorize read-only review or explicit future main-only test dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = LGuangming/a-share-value-screener
          case "$GITHUB_EVENT_NAME" in
            pull_request|push) ;;
            workflow_dispatch)
              test "$GITHUB_REF" = refs/heads/main
              test "$CONFIRM" = PUBLISH-PR28-TEST
              ;;
            *) exit 1 ;;
          esac
      - name: Verify pinned PR28 successful CI and independent acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN" > "$RUNNER_TEMP/reviewed-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN/jobs?per_page=100" > "$RUNNER_TEMP/reviewed-jobs.json"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"reviewed-run.json").read_text())
          j=json.loads((root/"reviewed-jobs.json").read_text())
          assert r["head_sha"]==os.environ["REVIEWED_SHA"] and r["status"]=="completed" and r["conclusion"]=="success" and r["event"]=="push"
          expected={"python-tests (3.13)", "python-local-integration (postgres:18.7-alpine)", "next-build (postgres:18.7-alpine)", "docker-pr28 / resolve-base-images", "docker-pr28 / Release candidate Web + Minimal (postgres:18.7-alpine)", "docker-pr28 / Release candidate acceptance (no publication)"}
          assert j["total_count"]==6 and {x["name"] for x in j["jobs"]}==expected
          # GitHub may report a stale per-job status even after the run has
          # completed. Require a success conclusion AND a real completion time
          # for every job, bounded by the completed run's updated_at.
          from datetime import datetime
          def stamp(value):
              return datetime.fromisoformat(value.replace("Z","+00:00"))
          end=stamp(r["updated_at"])
          for x in j["jobs"]:
              assert x["conclusion"]=="success" and x.get("completed_at"), x["name"]
              assert stamp(x["started_at"]) <= stamp(x["completed_at"]) <= end, x["name"]
              if x["status"]!="completed":
                  assert x["status"]=="in_progress", x["name"]
                  print("API status lag (success and completion timestamp verified):",x["name"])
          gate=next(x for x in j["jobs"] if x["name"].endswith("Release candidate acceptance (no publication)"))
          step=[s for s in gate["steps"] if s["name"]=="Require all candidate functional and scoped security jobs to pass"]
          assert len(step)==1 and step[0]["status"]=="completed" and step[0]["conclusion"]=="success"
          print("PASS: completed reviewed run, all six successful jobs and independent acceptance step")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false
      - name: Confirm exact reviewed checkout
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - name: Verify committed candidate manifests (read only)
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source deploy/base-images.lock
          set +a
          for ref in "$NODE_BASE" "$PYTHON_BASE" "$WEB_RUNTIME_BASE"; do
            [[ "$ref" =~ @sha256:[a-f0-9]{64}$ ]]
            expected="${ref##*@}"
            actual="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ && !found {print $2; found=1}')"
            test "$actual" = "$expected"
          done
          printf 'node=%s\npython=%s\nweb_runtime=%s\n' "$NODE_BASE" "$PYTHON_BASE" "$WEB_RUNTIME_BASE" >> "$GITHUB_OUTPUT"
          # Preserve only the verified production build inputs in this receipt.
          grep -E '^(NODE_BASE|PYTHON_BASE|WEB_RUNTIME_BASE)=' deploy/base-images.lock > "$RUNNER_TEMP/base-images.lock"
          cat "$RUNNER_TEMP/base-images.lock" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve and hash exact CPython 3.13 wheels
        env:
          PYTHON_BASE: ${{ steps.resolve.outputs.python }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheel-candidates"
          docker run --rm --platform linux/amd64 --mount "type=bind,src=$PWD,dst=/source,readonly" --mount "type=bind,src=$RUNNER_TEMP/wheel-candidates,dst=/out" --entrypoint /usr/local/bin/python "$PYTHON_BASE" -m pip download --index-url https://pypi.org/simple --only-binary=:all: -r /source/backend/requirements-worker.lock.txt -d /out
          python3 tests/lock-worker-wheels.py backend/requirements-worker.lock.txt "$RUNNER_TEMP/wheel-candidates" "$RUNNER_TEMP/requirements-worker.cp313.hashes.txt"
          diff -u <(grep -v '^#' backend/requirements-worker.cp313.hashes.txt) <(grep -v '^#' "$RUNNER_TEMP/requirements-worker.cp313.hashes.txt")
          cat "$RUNNER_TEMP/requirements-worker.cp313.hashes.txt"
          docker run --rm --platform linux/amd64 --entrypoint /usr/local/bin/python "$PYTHON_BASE" --version
      - name: Preserve CPython 3.13 hash lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-cp313-hash-lock
          path: ${{ runner.temp }}/requirements-worker.cp313.hashes.txt
          retention-days: 14
          if-no-files-found: error
      - name: Preserve resolved base image references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-base-candidates
          path: ${{ runner.temp }}/base-images.lock
          retention-days: 14
          if-no-files-found: error
  candidate-pair:
    name: Build and accept exact Web + Minimal pair (read only)
    needs: resolve-base-images
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false
      - name: Confirm exact reviewed checkout
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - name: Verify pinned Minimal runtime Distroless cc manifest
        id: base
        shell: bash
        run: |
          set -euo pipefail
          source deploy/minimal-base.lock
          [[ "$MINIMAL_RUNTIME_BASE" =~ @sha256:[a-f0-9]{64}$ ]]
          expected="${MINIMAL_RUNTIME_BASE##*@}"
          actual="$(docker buildx imagetools inspect "$MINIMAL_RUNTIME_BASE" | awk '/^Digest:/ && !found {print $2; found=1}')"
          test "$actual" = "$expected"
          echo "ref=$MINIMAL_RUNTIME_BASE" >> "$GITHUB_OUTPUT"
          cp deploy/minimal-base.lock "$RUNNER_TEMP/minimal-base.lock"
      - name: Test scoped candidate vulnerability gate (no blanket CVE ignore)
        run: python3 -m unittest discover -s tests -p test_candidate_vulnerability_gate.py -v
      - name: Test SQLite source ZIP extraction and permission restoration
        run: python3 -m unittest discover -s tests -p test_sqlite_source_zip.py -v
      - name: Build default Minimal Worker release candidate (no push)
        id: minimal
        env:
          PYTHON_BASE: ${{ needs.resolve-base-images.outputs.python }}
          MINIMAL_RUNTIME_BASE: ${{ steps.base.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eval-reports
          docker build --progress=plain --pull --platform linux/amd64 --build-arg PYTHON_BASE="$PYTHON_BASE" --build-arg MINIMAL_RUNTIME_BASE="$MINIMAL_RUNTIME_BASE" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$REVIEWED_SHA" --label "org.opencontainers.image.version=test-pr28" -f Dockerfile.worker -t ashare-worker:minimal-eval . 2>&1 | tee eval-reports/minimal-build.log
      - name: Verify default Worker entrypoint and identity
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect ashare-worker:minimal-eval | python3 -c '
          import json, sys
          cfg = json.load(sys.stdin)[0]["Config"]
          assert cfg["Entrypoint"] == ["/usr/local/bin/python3", "-m", "value_screener.local_pipeline"]
          assert cfg["Cmd"] == ["--help"]
          assert cfg["User"] == "10002:10010"
          print("PASS: default Minimal image entrypoint, command and identity")
          '
      - name: Record actual runtime and test native wheels
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect ashare-worker:minimal-eval --format '{{.Size}} {{.Config.User}}'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /usr/local/bin/python3 ashare-worker:minimal-eval -c '
          import os,sys,ssl,sqlite3,duckdb,numpy,pandas,psycopg,boto3,baostock,zoneinfo,zlib,ctypes,shutil,importlib.util,importlib.metadata,json,xml.parsers.expat
          print(sys.version,ssl.OPENSSL_VERSION,sqlite3.sqlite_version,xml.parsers.expat.EXPAT_VERSION)
          assert sys.version_info[:3]==(3,13,18)
          assert xml.parsers.expat.EXPAT_VERSION=="expat_2.11.0"
          assert (os.getuid(),os.getgid())==(10002,10010)
          assert not os.path.exists("/bin/sh")
          assert all(shutil.which(x) is None for x in ("sh","bash","pip","pip3","apt","apt-get","dpkg"))
          assert all(importlib.util.find_spec(x) is None for x in ("pip","setuptools","wheel","ensurepip"))
          assert ssl.create_default_context().get_ca_certs()
          assert sqlite3.connect(":memory:").execute("select 1").fetchone()==(1,)
          assert duckdb.connect(":memory:").execute("select 1").fetchone()==(1,)
          assert numpy.array([1,2]).sum()==3 and pandas.Series([1,2]).sum()==3
          assert zlib.decompress(zlib.compress(b"fixture"))==b"fixture"
          assert zoneinfo.ZoneInfo("Asia/Shanghai")
          assert ctypes.CDLL("libzstd.so.1").ZSTD_versionNumber()==10507
          assert len(list(importlib.metadata.distributions()))==15
          print(open("/opt/cp313-provenance.json").read())
          print("PASS: minimal glibc native runtime")
          '
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges ashare-worker:minimal-eval --help
      - name: Validate final image shared libraries, package metadata and exact wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eval-reports
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --mount "type=bind,src=$PWD/tests/verify-minimal-runtime.py,dst=/verify-minimal-runtime.py,readonly" --entrypoint /usr/local/bin/python3 ashare-worker:minimal-eval /verify-minimal-runtime.py < backend/requirements-worker.lock.txt | tee eval-reports/runtime-verification.txt
      - name: Export actual final runtime provenance
        if: always() && steps.minimal.outcome == 'success'
        run: |
          mkdir -p eval-reports
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /usr/local/bin/python3 ashare-worker:minimal-eval -c 'print(open("/opt/cp313-provenance.json").read())' > eval-reports/cp313-provenance.json
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Build same pinned Web image for candidate Compose
        id: candidate_web
        env:
          NODE_BASE: ${{ needs.resolve-base-images.outputs.node }}
          WEB_RUNTIME_BASE: ${{ needs.resolve-base-images.outputs.web_runtime }}
        run: docker build --pull --platform linux/amd64 --build-arg NODE_BASE="$NODE_BASE" --build-arg WEB_RUNTIME_BASE="$WEB_RUNTIME_BASE" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$REVIEWED_SHA" --label "org.opencontainers.image.version=test-pr28" -f Dockerfile.web -t ashare-web:ci .
      - name: Verify final Web zstd payload, shell-free runtime and identity
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /nodejs/bin/node ashare-web:ci -e '
          const fs=require("node:fs"), crypto=require("node:crypto"), a=require("node:assert/strict");
          const base="/var/lib/dpkg/status.d/libzstd1";
          a.match(fs.readFileSync(base,"utf8"),/^Version: 1\.5\.7\+dfsg-1\+deb13u1$/m);
          for(const line of fs.readFileSync(base+".md5sums","utf8").trim().split("\n")){
            const [hash,...parts]=line.trim().split(/\s+/);const path="/"+parts.join(" ");
            a.equal(crypto.createHash("md5").update(fs.readFileSync(path)).digest("hex"),hash,path);
          }
          console.log("PASS: Web fixed zstd payload and package metadata");
          '
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /nodejs/bin/node ashare-web:ci -e '
          const a=require("node:assert/strict"), fs=require("node:fs"), path=require("node:path");
          a.equal(process.getuid(),10001); a.equal(process.getgid(),10010); a.match(process.version,/^v26\./);
          for(const dir of process.env.PATH.split(":")) for(const tool of ["sh","bash","npm","npx","yarn","yarnpkg","corepack","apt","apt-get","dpkg"]) a.equal(fs.existsSync(path.join(dir,tool)),false,"Unexpected runtime tool: "+tool);
          a.equal(fs.existsSync("/bin/sh"),false);
          a.ok(fs.existsSync("/app/test-web-launch.cjs"));
          console.log("PASS: shell-free Node 26 runtime");
          '
      - name: Verify pair labels, platform, identity and credential-free metadata
        run: |
          set -euo pipefail
          docker image inspect ashare-web:ci ashare-worker:minimal-eval | python3 -c '
          import json,os,sys
          images=json.load(sys.stdin)
          assert len(images)==2
          for i,user,entry,cmd in zip(images,("10001:10010","10002:10010"),(["/nodejs/bin/node"],["/usr/local/bin/python3","-m","value_screener.local_pipeline"]),(["/app/server.js"],["--help"])):
              cfg=i["Config"]
              assert (i["Os"],i["Architecture"],cfg["User"])==("linux","amd64",user)
              assert cfg["Entrypoint"]==entry and cfg["Cmd"]==cmd
              assert cfg["Labels"]["org.opencontainers.image.revision"]==os.environ["REVIEWED_SHA"]
              assert cfg["Labels"]["org.opencontainers.image.source"]=="https://github.com/"+os.environ["GITHUB_REPOSITORY"]
              assert cfg["Labels"]["org.opencontainers.image.version"]=="test-pr28"
              names={v.split("=",1)[0] for v in cfg["Env"]}
              assert not any(n in {"DATABASE_URL","DATABASE_READ_URL","SITE_ACCESS_PASSWORD","SITE_SESSION_SECRET","GITHUB_TOKEN","GH_TOKEN","GHCR_TOKEN","ARCHIVE_LOCAL_WEB_COOKIE"} or n.startswith(("NEON_","TUSHARE_","AWS_")) for n in names)
          print("PASS: pair metadata and credential variable exclusion")
          '
      - name: Full isolated Minimal Compose smoke and recreation (actual VPS test overlay)
        env:
          ASHARE_CI_WORKER_VARIANT: minimal
        run: bash tests/docker-smoke.sh
      - name: Collect static reachability evidence (no exploitation)
        if: always()
        shell: bash
        run: |
          mkdir -p eval-reports
          git grep -nEi 'quic|http3|wrap_bio|sni_callback|HTMLParser|html\.parser|xml\.etree|xml\.parsers|tarfile|extractall|sqlite3|FTS5|nsenter|infocmp|libuuid|uuid4|urllib\.request|boto3|baostock' -- app lib backend/value_screener compose.yaml compose.vps-test.yaml compose.loopback.yaml > eval-reports/source-usage.txt || test "$?" = 1
          cp "$RUNNER_TEMP/minimal-base.lock" eval-reports/
      - name: Minimal candidate SBOM
        if: always() && steps.minimal.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ashare-worker:minimal-eval
          format: cyclonedx
          output: eval-reports/minimal.cdx.json
          cache: 'false'
      - name: Minimal candidate secret gate
        if: always() && steps.minimal.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ashare-worker:minimal-eval
          scanners: secret
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: table
          exit-code: '1'
          cache: 'false'
      - name: Trivy 0.70.0 minimal raw HIGH and CRITICAL scan
        id: raw_minimal_070
        if: always() && steps.minimal.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.70.0'
          scan-type: image
          image-ref: ashare-worker:minimal-eval
          scanners: vuln
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: 'false'
          format: json
          output: eval-reports/minimal-trivy0700-vuln.json
          exit-code: '0'
          cache: 'false'
      - name: Trivy 0.70.0 minimal scoped vulnerability gate
        if: always() && steps.raw_minimal_070.outcome == 'success'
        run: python3 tests/candidate_vulnerability_gate.py --candidate minimal --image-id "$(docker image inspect ashare-worker:minimal-eval --format '{{.Id}}')" --report eval-reports/minimal-trivy0700-vuln.json --decision eval-reports/minimal-trivy0700-decision.json
      - name: Independent upstream CPython and embedded Expat security gate
        if: always() && steps.minimal.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eval-reports
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --mount "type=bind,src=$PWD/tests/audit-minimal-components.py,dst=/audit-minimal-components.py,readonly" --entrypoint /usr/local/bin/python3 ashare-worker:minimal-eval /audit-minimal-components.py | tee eval-reports/upstream-components-review.json
      - name: Trivy 0.76.2 minimal SBOM
        if: always() && steps.minimal.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.2'
          scan-type: image
          image-ref: ashare-worker:minimal-eval
          format: cyclonedx
          output: eval-reports/minimal-trivy0762.cdx.json
          cache: 'false'
      - name: Trivy 0.76.2 minimal secret gate
        if: always() && steps.minimal.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.2'
          scan-type: image
          image-ref: ashare-worker:minimal-eval
          scanners: secret
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: json
          output: eval-reports/minimal-trivy0762-secret.json
          exit-code: '1'
          cache: 'false'
      - name: Trivy 0.76.2 minimal raw HIGH and CRITICAL scan
        id: raw_minimal_076
        if: always() && steps.minimal.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.2'
          scan-type: image
          image-ref: ashare-worker:minimal-eval
          scanners: vuln
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: 'false'
          format: json
          output: eval-reports/minimal-trivy0762-vuln.json
          exit-code: '0'
          cache: 'false'
      - name: Trivy 0.76.2 minimal scoped vulnerability gate
        if: always() && steps.raw_minimal_076.outcome == 'success'
        run: python3 tests/candidate_vulnerability_gate.py --candidate minimal --image-id "$(docker image inspect ashare-worker:minimal-eval --format '{{.Id}}')" --report eval-reports/minimal-trivy0762-vuln.json --decision eval-reports/minimal-trivy0762-decision.json
      - name: Trivy 0.76.2 web SBOM
        if: always() && steps.candidate_web.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.2'
          scan-type: image
          image-ref: ashare-web:ci
          format: cyclonedx
          output: eval-reports/web-trivy0762.cdx.json
          cache: 'false'
      - name: Trivy 0.76.2 web secret gate
        if: always() && steps.candidate_web.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.2'
          scan-type: image
          image-ref: ashare-web:ci
          scanners: secret
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: json
          output: eval-reports/web-trivy0762-secret.json
          exit-code: '1'
          cache: 'false'
      - name: Trivy 0.76.2 web raw HIGH and CRITICAL scan
        id: raw_web_076
        if: always() && steps.candidate_web.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.2'
          scan-type: image
          image-ref: ashare-web:ci
          scanners: vuln
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: 'false'
          format: json
          output: eval-reports/web-trivy0762-vuln.json
          exit-code: '0'
          cache: 'false'
      - name: Trivy 0.76.2 web scoped vulnerability gate
        if: always() && steps.raw_web_076.outcome == 'success'
        run: python3 tests/candidate_vulnerability_gate.py --candidate web --image-id "$(docker image inspect ashare-web:ci --format '{{.Id}}')" --report eval-reports/web-trivy0762-vuln.json --decision eval-reports/web-trivy0762-decision.json
      - name: Require all candidate vulnerability decisions
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          for name in ("minimal-trivy0700","minimal-trivy0762","web-trivy0762"):
              path = pathlib.Path("eval-reports") / (name + "-decision.json")
              if not path.is_file() or json.loads(path.read_text()).get("passed") is not True:
                  raise SystemExit("BLOCK: absent or failed candidate decision: " + name)
          print("PASS: all three scoped vulnerability decisions")
          PY
      - name: Report candidate raw scan results
        if: always() && steps.minimal.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, collections
          for name in ("minimal", "web"):
              p = pathlib.Path("eval-reports") / (name + "-trivy0762-vuln.json")
              if not p.is_file():
                  print(p.name, "MISSING: no scan result available")
                  continue
              data = json.loads(p.read_text())
              counts = collections.Counter(v["Severity"] for r in (data.get("Results") or []) for v in (r.get("Vulnerabilities") or []))
              print(p.name, {"HIGH": counts["HIGH"], "CRITICAL": counts["CRITICAL"]})
          PY
      - name: Generate explicit upstream SQLite CycloneDX component inventory
        if: always() && steps.minimal.outcome == 'success'
        run: |
          mkdir -p eval-reports
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("eval-reports/cp313-provenance.json").read_text())
          s = data["sqlite_rebuild"]
          component = {"type":"library","bom-ref":"upstream-sqlite-"+s["source"]["version"],"name":"sqlite",
                       "version":s["source"]["version"],"purl":"pkg:generic/sqlite@"+s["source"]["version"],
                       "cpe":"cpe:2.3:a:sqlite:sqlite:"+s["source"]["version"]+":*:*:*:*:*:*:*",
                       "hashes":[{"alg":"SHA-256","content":s["library_sha256"]}],
                       "externalReferences":[{"type":"distribution","url":s["source"]["url"]}],
                       "properties":[{"name":"source:sha256","value":s["source"]["sha256"]},
                                     {"name":"source:id","value":s["source"]["source_id"]},
                                     {"name":"installed:path","value":"/usr/local/lib/libsqlite3.so.0"}]}
          Path("eval-reports/upstream-sqlite.cdx.json").write_text(json.dumps({"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[component]},indent=2)+"\n")
          PY
      - name: Record Web and Worker actual OpenSSL identity (no network)
        if: always() && steps.minimal.outcome == 'success' && steps.candidate_web.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /nodejs/bin/node ashare-web:ci -e '
          const fs=require("node:fs"), crypto=require("node:crypto"), tls=require("node:tls");
          const meta="/var/lib/dpkg/status.d/libssl3t64";
          const libs=process.report.getReport().sharedObjects.filter(x=>/libssl|libcrypto/.test(x));
          console.log(JSON.stringify({node:process.version,openssl:process.versions.openssl,quic:process.versions.ngtcp2||null,sharedObjects:libs,packageMetadata:fs.readFileSync(meta,"utf8"),sha256:crypto.createHash("sha256").update("fixture").digest("hex"),rootCertificates:tls.rootCertificates.length},null,2));
          ' | tee eval-reports/web-openssl-runtime.json
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /usr/local/bin/python3 ashare-worker:minimal-eval -c '
          import ssl, _ssl, hashlib, json, subprocess
          print(json.dumps({"openssl":ssl.OPENSSL_VERSION,"links":subprocess.check_output(["/lib64/ld-linux-x86-64.so.2","--list",_ssl.__file__],text=True),"packageMetadata":open("/var/lib/dpkg/status.d/libssl3t64").read(),"caCertificates":len(ssl.create_default_context().get_ca_certs()),"sha256":hashlib.sha256(b"fixture").hexdigest()},indent=2))
          ' | tee eval-reports/worker-openssl-runtime.json
      - name: Export and validate supplemental upstream component inventory
        if: always() && steps.minimal.outcome == 'success'
        run: python3 tests/export-upstream-components.py eval-reports
      - name: Seal accepted pair and verify save/load identity (no registry)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/accepted-pair"
          mkdir -p "$dir"
          web="$(docker image inspect ashare-web:ci --format '{{.Id}}')"
          worker="$(docker image inspect ashare-worker:minimal-eval --format '{{.Id}}')"
          export web worker
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"accepted-pair"
          out={"source":os.environ["REVIEWED_SHA"],"reviewed_run":os.environ["REVIEWED_RUN"],"run_id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"web":os.environ["web"],"minimal":os.environ["worker"]}
          for name,kind in (("minimal-trivy0700","minimal"),("minimal-trivy0762","minimal"),("web-trivy0762","web")):
              decision=json.loads(pathlib.Path("eval-reports",name+"-decision.json").read_text())
              assert decision["passed"] is True and decision["image_id"]==out[kind] and not decision["blocking"]
          (root/"pair.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
          cp eval-reports/*-vuln.json eval-reports/*-decision.json "$dir/"
          docker save ashare-web:ci ashare-worker:minimal-eval | gzip -1 > "$dir/pair.tar.gz"
          docker image rm ashare-web:ci ashare-worker:minimal-eval
          docker load -i "$dir/pair.tar.gz"
          test "$(docker image inspect ashare-web:ci --format '{{.Id}}')" = "$web"
          test "$(docker image inspect ashare-worker:minimal-eval --format '{{.Id}}')" = "$worker"
          (cd "$dir"; sha256sum pair.tar.gz pair.json *-vuln.json *-decision.json > SHA256SUMS; sha256sum --strict -c SHA256SUMS)
          cp "$dir/pair.json" "$dir/SHA256SUMS" eval-reports/
          echo "PASS: both accepted images survive exact save/load; no push"
      - name: Preserve successful evaluation evidence (no image archive)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-pair-evidence-${{ github.run_attempt }}
          path: eval-reports/
          retention-days: 14
          if-no-files-found: error
      - name: Transfer accepted pair only on authorized future dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-pair-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted-pair/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error


