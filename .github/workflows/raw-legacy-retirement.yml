name: A-Share Retire Verified Legacy Raw Archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/raw-retire-verified-20261124.txt'
permissions:
  contents: read
concurrency:
  group: a-share-backtest-history
  queue: max
  cancel-in-progress: false
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: backend
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit all active source and workflow paths
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'a-share-backtest/v1|phase2/(financial_snapshot|universe|historical_st|adj_factor|daily_basic|stk_limit|suspend_d|disclosures)' -- app components lib backend/value_screener .github/workflows ':!backend/value_screener/raw_consolidation.py' ':!backend/value_screener/raw_legacy_retirement.py'; then
            echo 'Active legacy path found; aborting retirement'
            exit 1
          else
            rc=$?
            test "$rc" -eq 1
          fi
          echo 'LEGACY_DEPENDENCY_AUDIT active_main_readers_and_writers=passed'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive dependencies and run retirement safety tests
        run: |
          pip install -r backend/requirements.txt
          pip install 'boto3>=1.35,<2'
          python -m unittest discover -s backend/tests -p test_raw_legacy_retirement.py -v
      - name: Verify production, exact inventory and checksums before retiring duplicates
        run: python -m value_screener.raw_legacy_retirement
