name: Data migration preparation (isolated fixtures only)
on:
  pull_request:
    paths:
      - 'scripts/migration/**'
      - 'docs/VPS_DATA_MIGRATION.md'
      - '.github/workflows/data-migration-inventory.yml'
  push:
    branches:
      - 'feature/vps-data-migration-preparation'
    paths:
      - 'scripts/migration/**'
      - 'docs/VPS_DATA_MIGRATION.md'
      - '.github/workflows/data-migration-inventory.yml'
permissions:
  contents: read
jobs:
  simulated-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'boto3>=1.40,<2' 'moto[s3]>=5,<6' 'pyarrow>=19,<25' 'duckdb>=1.2,<2'
      - run: PYTHONPATH=scripts/migration /usr/bin/time -v python -m unittest discover -s scripts/migration/tests -v
      - run: bash -n scripts/migration/inventory_vps.sh
  postgres-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: ['17', '18']
    services:
      source:
        image: postgres:${{ matrix.source }}-alpine
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: ashare_source
        ports:
          - 55431:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ashare_source"
          --health-interval 5s --health-timeout 5s --health-retries 12
      target:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: ashare_migration
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ashare_migration"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PostgreSQL 18 client and Python dependencies
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Snapshot, restore and verify fixtures
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGSSLMODE: disable
        run: |
          set -euo pipefail
          umask 077
          export PGPASSFILE="$RUNNER_TEMP/fixture.pgpass"
          printf '127.0.0.1:55431:ashare_source:postgres:fixture-only-password\n127.0.0.1:55432:ashare_migration:postgres:fixture-only-password\n' > "$PGPASSFILE"
          trap 'rm -f "$PGPASSFILE"' EXIT
          export PGPORT=55431 PGDATABASE=ashare_source
          psql -v ON_ERROR_STOP=1 -f scripts/migration/tests/fixture.sql
          /usr/bin/time -v python scripts/migration/postgres.py backup --root "$RUNNER_TEMP/evidence"
          du -sb "$RUNNER_TEMP/evidence"
          cp -a "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/recovery-copy"
          export PGPORT=55432 PGDATABASE=ashare_migration
          /usr/bin/time -v python scripts/migration/postgres.py restore --root "$RUNNER_TEMP/evidence" --approved-isolated-restore
          /usr/bin/time -v python scripts/migration/postgres.py verify --root "$RUNNER_TEMP/evidence"
          if python scripts/migration/postgres.py restore --root "$RUNNER_TEMP/evidence" --approved-isolated-restore; then exit 1; fi
          psql -v ON_ERROR_STOP=1 -c "UPDATE research.quotes SET close=99 WHERE stock_id=1"
          if python scripts/migration/postgres.py verify --root "$RUNNER_TEMP/evidence"; then exit 1; fi
          echo 'PASS: restore guard and tamper detection'

          # Fixture target only: roles and database are disposable service-container data.
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE screener_reader LOGIN CONNECTION LIMIT 8 PASSWORD 'fixture-only-password'; CREATE ROLE screener_writer LOGIN CONNECTION LIMIT 8 PASSWORD 'fixture-only-password';"
          python scripts/migration/permissions.py apply --policy scripts/migration/tests/acl-policy.json --root "$RUNNER_TEMP/evidence" --approved-isolated-acl
          python scripts/migration/permissions.py verify --policy scripts/migration/tests/acl-policy.json --root "$RUNNER_TEMP/evidence"
          printf '127.0.0.1:55432:ashare_migration:screener_reader:fixture-only-password\n127.0.0.1:55432:ashare_migration:screener_writer:fixture-only-password\n' >> "$PGPASSFILE"
          PGUSER=screener_reader psql -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.stocks;"
          PGUSER=screener_writer psql -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.stocks;"
          if PGUSER=screener_reader psql -v ON_ERROR_STOP=1 -c "SELECT nextval('public.stocks_id_seq')"; then exit 1; fi
          PGUSER=screener_writer psql -v ON_ERROR_STOP=1 -c "SELECT nextval('public.stocks_id_seq')"
          psql -v ON_ERROR_STOP=1 -c "SET ROLE screener_reader; SELECT count(*) FROM public.stocks;"
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE screener_reader; INSERT INTO public.stocks(id,code) VALUES (999,'denied');"; then exit 1; fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE screener_reader; UPDATE research.quotes SET close=0;"; then exit 1; fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE screener_reader; DELETE FROM public.stocks;"; then exit 1; fi
          psql -v ON_ERROR_STOP=1 -c "BEGIN; SET LOCAL ROLE screener_writer; INSERT INTO public.stocks(id,code) VALUES (999,'fixture'); UPDATE public.stocks SET code='fixture2' WHERE id=999; DELETE FROM public.stocks WHERE id=999; ROLLBACK;"
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE screener_writer; CREATE TABLE public.denied(id int);"; then exit 1; fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE screener_writer; TRUNCATE public.stocks CASCADE;"; then exit 1; fi
          psql -v ON_ERROR_STOP=1 -c "GRANT SELECT ON research.catalog_fixture TO screener_reader"
          if python scripts/migration/permissions.py verify --policy scripts/migration/tests/acl-policy.json --root "$RUNNER_TEMP/evidence"; then exit 1; fi
          echo 'PASS: least privilege, real statements and ACL drift detection'
          # Simulate recovery from immutable secondary backup on the disposable target.
          [[ "$PGPORT" == 55432 && "$PGDATABASE" == ashare_migration ]]
          printf 'corrupt' >> "$RUNNER_TEMP/evidence/source.dump"
          if python scripts/migration/postgres.py restore --root "$RUNNER_TEMP/evidence" --approved-isolated-restore; then exit 1; fi
          export PGDATABASE=postgres
          printf '127.0.0.1:55432:postgres:postgres:fixture-only-password\n' >> "$PGPASSFILE"
          psql -v ON_ERROR_STOP=1 -c 'DROP DATABASE ashare_migration'
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ashare_migration'
          export PGDATABASE=ashare_migration
          /usr/bin/time -v python scripts/migration/postgres.py restore --root "$RUNNER_TEMP/recovery-copy" --approved-isolated-restore
          python scripts/migration/postgres.py verify --root "$RUNNER_TEMP/recovery-copy"
          python scripts/migration/permissions.py apply --policy scripts/migration/tests/acl-policy.json --root "$RUNNER_TEMP/recovery-copy" --approved-isolated-acl
          echo 'PASS: independent backup recovery and ACL reconstruction'

  pressure-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: 100MB
            rows: 120000
          - tier: 500MB
            rows: 600000
          - tier: 1GB
            rows: 1200000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Constrained PostgreSQL pressure and recovery
        env:
          FIXTURE_ROWS: ${{ matrix.rows }}
          FIXTURE_TIER: ${{ matrix.tier }}
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGSSLMODE: disable
        run: bash scripts/migration/tests/pressure_postgres.sh
      - name: Remove disposable containers
        if: always()
        run: docker rm -f migration-pressure-source migration-pressure-target 2>/dev/null || true
  pressure-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rows: [90000, 150000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'boto3>=1.40,<2' 'pyarrow>=19,<25' 'duckdb>=1.2,<2' numpy
      - name: Generate 6000 objects, full and incremental sync, DuckDB validation
        env:
          FIXTURE_ROWS: ${{ matrix.rows }}
        run: |
          set -euo pipefail
          export PYTHONPATH=scripts/migration
          # Runner-side worker is limited to two CPU cores and 1 GiB memory.
          # systemd scope inherits the runner user; fixture has no network client.
          sudo systemd-run --scope --quiet -p CPUQuota=200% -p MemoryMax=1G -p MemorySwapMax=0 \
            sudo -u "$(id -un)" env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" /usr/bin/time -v python scripts/migration/tests/pressure_storage.py --root "$RUNNER_TEMP/storage-pressure" --rows "$FIXTURE_ROWS"
