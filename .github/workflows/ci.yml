name: Tests and Build
on:
  push:
    paths-ignore:
      - '.github/one-shot/**'
  pull_request:
permissions:
  contents: read
jobs:
  # Explicit same-revision Docker CI for reviewed application branches and main.
  # No inherited secrets, registry permissions, publication or deployment.
  docker-pr28:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/vps-image-security' || github.ref == 'refs/heads/integration/vps-11e15a' || github.ref == 'refs/heads/integration/vps-11e15d' || github.ref == 'refs/heads/integration/ghcr-11e16c' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/docker-ci.yml
    permissions:
      contents: read
  # Explicit no-package-permission review of the GHCR workflow and final integration branches.
  ghcr-pr27-review:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/ghcr-test-publish' || github.ref == 'refs/heads/integration/vps-11e15d')
    uses: ./.github/workflows/ghcr-reviewed-pair.yml
    permissions:
      contents: read
      actions: read
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Screening, multi-strategy and backtest kernel tests (no credentials)
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
  python-local-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['postgres:18.7-alpine']
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: ashare_pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d ashare_pipeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated worker dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-worker.cp313.hashes.txt
          python -m pip check
      - name: Actual PostgreSQL and Parquet local pipeline integration
        env:
          PYTHONPATH: backend
          TEST_PIPELINE_DATABASE_URL: postgresql://fixture_admin:fixture_only@127.0.0.1:5432/ashare_pipeline_test
        run: python -m unittest discover -s backend/tests -p test_local_pipeline_integration.py -v
  next-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['postgres:18.7-alpine']
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: ashare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d ashare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Fundamental review classification tests
        run: npm run test:review
      - name: Stock detail chart and history integration regression tests
        run: npm run test:price-history
      - name: Multi-strategy catalog and UI tests
        run: npm run test:strategies
      - name: General company research tests
        run: node --test tests/company-research.test.cjs
      - name: Database driver unit and PostgreSQL integration tests
        env:
          TEST_POSTGRES_URL: postgresql://fixture_admin:fixture_only@127.0.0.1:5432/ashare_test
          TZ: Asia/Shanghai
        run: npm run test:db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixture-only Parquet generator
        run: |
          python -m pip install --only-binary=:all: 'duckdb==1.5.6'
      - name: Archive storage and real Parquet compatibility tests
        env:
          ARCHIVE_TEST_FIXTURES: '1'
        run: npm run test:archive
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Website password gate HTTP smoke tests
        run: node tests/site-access-smoke.cjs
  # Explicit opt-in on a main merge commit; never publish for ordinary PRs.
  publish-test-web:
    if: github.repository == 'LGuangming/a-share-value-screener' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-test-web]')
    needs: [python-tests, python-local-integration, next-build, docker-pr28]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build exact tested Web revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source deploy/base-images.lock
          image="ghcr.io/lguangming/a-share-value-screener-web-test-pr28:sha-$GITHUB_SHA"
          docker build --pull --platform linux/amd64 --build-arg NODE_BASE="$NODE_BASE" --build-arg WEB_RUNTIME_BASE="$WEB_RUNTIME_BASE" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f Dockerfile.web -t "$image" .
      - name: Publish only the test Web image and record digest
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/lguangming/a-share-value-screener-web-test-pr28:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ && !found {print $2; found=1}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'Published immutable test Web image: %s@%s\n' "${image%:*}" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"

  # Publish the exact scanned Minimal image, never rebuild in a privileged job.
  publish-worker:
    if: github.repository == 'LGuangming/a-share-value-screener' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-worker]')
    needs: [python-tests, python-local-integration, next-build, docker-pr28]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download same-run accepted Worker candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: accepted-worker-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted-worker
      - name: Verify candidate provenance before authenticating
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/accepted-worker"
          sha256sum -c SHA256SUMS
          test "$(cat revision.txt)" = "$GITHUB_SHA"
          [[ "$(cat image-id.txt)" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker load -i worker.tar
          test "$(docker image inspect ashare-worker:minimal-eval --format '{{.Id}}')" = "$(cat image-id.txt)"
          test "$(docker image inspect ashare-worker:minimal-eval --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker image inspect ashare-worker:minimal-eval | python3 -c '
          import json, sys
          cfg=json.load(sys.stdin)[0]
          assert cfg["Architecture"]=="amd64" and cfg["Os"]=="linux"
          assert cfg["Config"]["User"]=="10002:10010"
          assert cfg["Config"]["Entrypoint"]==["/usr/local/bin/python3","-m","value_screener.local_pipeline"]
          '
      - name: Publish accepted Worker and independently verify remote config identity
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/lguangming/a-share-value-screener-worker-test-pr28:sha-$GITHUB_SHA"
          expected="$(cat "$RUNNER_TEMP/accepted-worker/image-id.txt")"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag ashare-worker:minimal-eval "$image"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ && !found {print $2; found=1}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          immutable="${image%:*}@$digest"
          actual="$(docker buildx imagetools inspect --raw "$immutable" | python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["digest"])')"
          test "$actual" = "$expected"
          printf 'Published immutable accepted Worker: %s\nConfig image ID: %s\nRevision: %s\n' "$immutable" "$actual" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
