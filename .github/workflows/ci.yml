name: Tests and Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure screening-rule tests (no API credentials)
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Fundamental review classification tests
        run: npm run test:review
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
