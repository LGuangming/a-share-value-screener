name: Tests and Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Only supersede old PR runs. Never cancel or coalesce a main release run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.scope.outputs.python }}
      integration: ${{ steps.scope.outputs.integration }}
      web: ${{ steps.scope.outputs.web }}
      quick_web: ${{ steps.scope.outputs.quick_web }}
      docker: ${{ steps.scope.outputs.docker }}
      registry: ${{ steps.scope.outputs.registry }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test routing and workflow contracts
        run: |
          python3 -m unittest discover -s tests -p test_ci_scope.py -v
          python3 -m unittest discover -s tests -p test_workflow_retirement.py -v
      - name: Classify changed paths
        id: scope
        run: python3 tests/ci_scope.py
  docker-validation:
    needs: scope
    if: needs.scope.outputs.docker == 'true'
    uses: ./.github/workflows/docker-ci.yml
    permissions:
      contents: read
  next-quick:
    needs: scope
    if: needs.scope.outputs.quick_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
  python-tests:
    needs: scope
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Screening, multi-strategy and backtest kernel tests (no credentials)
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
      - name: FIN19 offline financial standardization and metric fixtures
        run: |
          python -m unittest discover -s tests -p test_fin19_standardize.py -v
          python -m unittest discover -s tests -p test_fin19_metrics.py -v
          python -m unittest discover -s tests -p test_fin19_quality.py -v
      - name: Registry manifest verification regression tests
        if: needs.scope.outputs.registry == 'true'
        run: |
          python -m unittest discover -s tests -p test_verify_worker_manifest.py -v
          python -m unittest discover -s tests -p test_diagnose_worker_identity.py -v
          python -m unittest discover -s tests -p test_approve_worker_identity.py -v
      - name: Archived GHCR safety contracts (offline only)
        if: needs.scope.outputs.registry == 'true'
        env:
          TEST_LOCAL_SCRATCH: '1'
        run: |
          python -m unittest discover -s tests -p test_ghcr_private_bootstrap.py -v
          python -m unittest discover -s tests -p test_ghcr_package_readiness.py -v
          python -m unittest discover -s tests -p test_ghcr_publish_pair.py -v
  python-local-integration:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['postgres:18.7-alpine']
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: ashare_pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d ashare_pipeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated worker dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-worker.cp313.hashes.txt
          python -m pip check
      - name: Actual PostgreSQL and Parquet local pipeline integration
        env:
          PYTHONPATH: backend
          TEST_PIPELINE_DATABASE_URL: postgresql://fixture_admin:fixture_only@127.0.0.1:5432/ashare_pipeline_test
        run: python -m unittest discover -s backend/tests -p test_local_pipeline_integration.py -v
  next-build:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['postgres:18.7-alpine']
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: ashare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d ashare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Fundamental review classification tests
        run: npm run test:review
      - name: Stock detail chart and history integration regression tests
        run: npm run test:price-history
      - name: Multi-strategy catalog and UI tests
        run: npm run test:strategies
      - name: General company research tests
        run: node --test tests/company-research.test.cjs
      - name: Database driver unit and PostgreSQL integration tests
        env:
          TEST_POSTGRES_URL: postgresql://fixture_admin:fixture_only@127.0.0.1:5432/ashare_test
          TZ: Asia/Shanghai
        run: npm run test:db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixture-only Parquet generator
        run: |
          python -m pip install --only-binary=:all: 'duckdb==1.5.6'
      - name: FIN19 V7 real Parquet quality fixture
        run: |
          python -c 'import duckdb'
          python -m unittest discover -s tests -p test_fin19_quality.py -v
      - name: FIN20 full Parquet snapshot and restoration fixture
        run: python -m unittest discover -s tests -p test_fin20_archive.py -v
      - name: Archive storage and real Parquet compatibility tests
        env:
          ARCHIVE_TEST_FIXTURES: '1'
        run: npm run test:archive
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Website password gate HTTP smoke tests
        run: node tests/site-access-smoke.cjs
  # Publish only the exact same-run accepted Web + Minimal Worker pair.
  # A normal push, PR or old test marker never publishes.
  publish-production:
    if: github.repository == 'LGuangming/a-share-value-screener' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-production]')
    needs: [scope, python-tests, python-local-integration, next-build, docker-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download same-run accepted production candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: accepted-production-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted-production
      - name: Verify accepted pair before registry authentication
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/accepted-production"
          sha256sum -c SHA256SUMS
          test "$(cat revision.txt)" = "$GITHUB_SHA"
          for kind in web worker; do
            [[ "$(cat "$kind-id.txt")" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker load -i "$kind.tar"
          done
          for item in 'web ashare-web:ci 10001:10010' 'worker ashare-worker:minimal-eval 10002:10010'; do
            read -r kind local user <<< "$item"
            test "$(docker image inspect "$local" --format '{{.Id}}')" = "$(cat "$kind-id.txt")"
            test "$(docker image inspect "$local" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
            test "$(docker image inspect "$local" --format '{{.Os}}/{{.Architecture}} {{.Config.User}}')" = "linux/amd64 $user"
          done
          test "$(docker image inspect ashare-worker:minimal-eval --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/python3","-m","value_screener.local_pipeline"]'
      - name: Publish and verify both private production images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/accepted-production"
          # Fail closed before any push unless BOTH formal packages already exist,
          # are private, and are associated with this repository.
          verify_private() {
            local kind="$1"
            gh api "users/lguangming/packages/container/a-share-value-screener-$kind" |
              jq -e --arg name "a-share-value-screener-$kind" --arg repo "$GITHUB_REPOSITORY" '
                .name == $name and .package_type == "container" and
                .visibility == "private" and (.owner.login | ascii_downcase) == "lguangming" and
                (.repository.full_name | ascii_downcase) == ($repo | ascii_downcase)
              ' >/dev/null
          }
          verify_private web
          verify_private worker
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          tag="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          # Each run has a separate tag; never publish a mutable latest tag.
          for item in 'web ashare-web:ci' 'worker ashare-worker:minimal-eval'; do
            read -r kind local <<< "$item"
            package="ghcr.io/lguangming/a-share-value-screener-$kind"
            docker tag "$local" "$package:$tag"
            docker push "$package:$tag"
            digest="$(docker buildx imagetools inspect "$package:$tag" | awk '/^Digest:/ && !found {print $2; found=1}')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            pin="$package@$digest"
            # Independently resolve the remote manifest config, in addition to
            # checking the actual authenticated pull and the original archive.
            PYTHONPATH="$GITHUB_WORKSPACE/tests" python3 - "$pin" "$(cat "$kind-config.txt")" <<'PY'
          import sys
          from verify_worker_manifest import config_digest, fetch_manifest
          if config_digest(sys.argv[1], fetch_manifest) != sys.argv[2]:
              raise SystemExit("Registry manifest config differs from accepted archive")
          PY
            docker pull --platform linux/amd64 "$pin"
            test "$(docker image inspect "$pin" --format '{{.Id}}')" = "$(cat "$kind-id.txt")"
            test "$(docker image inspect "$pin" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
            test "$(docker image inspect "$pin" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
            verify_private "$kind"
            printf '%s\n' "$pin" > "$kind-pin.txt"
          done
          mkdir -p "$RUNNER_TEMP/production-receipt"
          jq -n --arg revision "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg web "$(cat web-pin.txt)" --arg worker "$(cat worker-pin.txt)" \
            '{revision:$revision,run_id:$run,attempt:$attempt,web_image:$web,worker_image:$worker,complete:true,deployment_authorized:false}' \
            > "$RUNNER_TEMP/production-receipt/release.json"
          printf 'Verified production image pair (not deployed):\nWEB_IMAGE=%s\nWORKER_IMAGE=%s\n' "$(cat web-pin.txt)" "$(cat worker-pin.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete production publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-receipt
          path: ${{ runner.temp }}/production-receipt/release.json
          if-no-files-found: error
          retention-days: 90

  ci-result:
    name: CI result
    if: always()
    needs: [scope, python-tests, python-local-integration, next-quick, next-build, docker-validation, publish-production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require each selected job to succeed and unselected jobs to skip
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          n = json.loads(os.environ["NEEDS_JSON"])
          if n["scope"]["result"] != "success":
              raise SystemExit("CI scope failed")
          flags = n["scope"]["outputs"]
          for job, flag in {
              "python-tests":"python", "python-local-integration":"integration",
              "next-quick":"quick_web", "next-build":"web",
              "docker-validation":"docker", "publish-production":"release",
          }.items():
              if flags.get(flag) not in ("true", "false"):
                  raise SystemExit("Missing scope output: "+flag)
              expected = "success" if flags[flag] == "true" else "skipped"
              if n[job]["result"] != expected:
                  raise SystemExit(f"{job}: expected {expected}, got {n[job]['result']}")
          print("PASS: selected CI jobs and release gate")
          PY
