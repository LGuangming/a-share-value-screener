name: A-Share Neon Capacity Audit
on:
  workflow_dispatch:
  # One-time initial audit, removed immediately after first launch.
  push:
    branches: [main]
    paths:
      - '.github/one-shot/storage-audit-20261123.txt'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Query PostgreSQL allocation and table sizes (read-only)
        run: python -m value_screener.capacity_audit
