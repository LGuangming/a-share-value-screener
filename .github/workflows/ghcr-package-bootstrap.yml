name: GHCR private package bootstrap (manual only)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Enter BOOTSTRAP-PRIVATE-GHCR only after separate initialization approval'
        required: true
        type: string
      owner_confirmed_absent:
        description: 'Owner has checked both exact package names are absent and no external writer is active'
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ghcr-pr28-test-workflow_dispatch
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'LGuangming/a-share-value-screener' && github.actor == 'LGuangming' && github.triggering_actor == 'LGuangming' && inputs.confirm == 'BOOTSTRAP-PRIVATE-GHCR' && inputs.owner_confirmed_absent == true && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact main dispatch checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Initialize only owner-confirmed absent packages using scratch markers
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          OWNER_CONFIRMED_ABSENT: ${{ inputs.owner_confirmed_absent }}
        run: python3 tests/ghcr_private_bootstrap.py
      - name: Preserve bootstrap or partial failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghcr-bootstrap-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-bootstrap.json
          retention-days: 14
          if-no-files-found: error
