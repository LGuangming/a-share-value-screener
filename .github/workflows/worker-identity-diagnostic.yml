name: Worker identity diagnostic (read only)
on:
  push:
    branches: [fix/worker-identity-diagnostic]
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  diagnose:
    if: github.repository == 'LGuangming/a-share-value-screener' && contains(github.event.head_commit.message, '[diagnose-worker-aca1c37]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 'aca1c37bf348d396ef4c4305b95d71e4e5fbf902'
      IMMUTABLE: 'ghcr.io/lguangming/a-share-value-screener-worker-test-pr28@sha256:0eff99f41d06b444a623f0a6bad776cb71ee141e022b98708c4189c803380139'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test diagnostic and manifest parsing
        run: |
          python3 -m unittest discover -s tests -p test_diagnose_worker_identity.py -v
          python3 -m unittest discover -s tests -p test_verify_worker_manifest.py -v
      - name: Verify original acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45761576076" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45761576076/attempts/1/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          run=json.loads((p/"source-run.json").read_text())
          assert run["head_sha"]==os.environ["SOURCE_SHA"] and run["head_branch"]=="main"
          assert run["event"]=="push" and run["status"]=="completed" and run["run_attempt"]==1
          jobs={j["name"]:j for j in json.loads((p/"source-jobs.json").read_text())["jobs"]}
          for name in ("python-tests (3.13)","python-local-integration (postgres:18.7-alpine)",
                       "next-build (postgres:18.7-alpine)","docker-pr28 / resolve-base-images",
                       "docker-pr28 / Release candidate Web + Minimal (postgres:18.7-alpine)",
                       "docker-pr28 / Release candidate acceptance (no publication)"):
              assert jobs[name]["conclusion"]=="success",name
          PY
      - name: Download exact accepted archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: accepted-worker-aca1c37bf348d396ef4c4305b95d71e4e5fbf902-a1
          run-id: 45761576076
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted-worker
      - name: Compare archived and pulled image without running it
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/accepted-worker"
          (cd "$dir"; sha256sum -c SHA256SUMS)
          test "$(cat "$dir/revision.txt")" = "$SOURCE_SHA"
          expected="$(cat "$dir/image-id.txt")"
          docker load -i "$dir/worker.tar"
          test "$(docker image inspect ashare-worker:minimal-eval --format '{{.Id}}')" = "$expected"
          test "$(docker image inspect ashare-worker:minimal-eval --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/identity-report"
          python3 tests/diagnose_worker_identity.py "$dir/worker.tar" "$IMMUTABLE" "$expected" "$RUNNER_TEMP/identity-report/identity.json"
      - name: Preserve diagnostic evidence (not acceptance)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-identity-diagnostic
          path: ${{ runner.temp }}/identity-report/identity.json
          if-no-files-found: warn
          retention-days: 14
