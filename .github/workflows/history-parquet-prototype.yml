name: A-Share 2025 Parquet History Prototype
on:
  # One-time user-authorized private-storage read/write/delete check.
  push:
    branches: [main]
    paths:
      - '.github/one-shot/neon-storage-check-20261123.txt'
  workflow_dispatch:
    inputs:
      operation:
        description: 'check: credentials; archive: fetch+upload; restore: download+verify'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - archive
          - restore
      year:
        description: 'Completed historical calendar year (default 2025)'
        required: true
        default: '2025'
        type: string

permissions:
  contents: read

concurrency:
  group: a-share-backtest-history
  cancel-in-progress: false

jobs:
  parquet:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: backend
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_API_SOURCE: official
      HISTORY_YEAR: ${{ inputs.year || '2025' }}
      HISTORY_OPERATION: ${{ inputs.operation || 'check' }}
      # Neon project and branch-scoped storage values: NEVER use DATABASE_URL
      # credentials for object storage or expose access keys to the browser.
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install 'duckdb>=1.3,<2' 'boto3>=1.35,<2'
      - name: Validate year and operation
        run: |
          python - <<'PY'
          import datetime,os
          year=int(os.environ["HISTORY_YEAR"])
          op=os.environ["HISTORY_OPERATION"]
          assert op in ("check","archive","restore"), "Invalid archive operation"
          assert 2010 <= year < datetime.date.today().year, "Completed years only"
          PY
      - name: Verify private Neon bucket and scoped read/write credentials
        if: ${{ github.event_name == 'push' || inputs.operation == 'check' || inputs.operation == 'archive' }}
        run: python -m value_screener.neon_archive check --year "$HISTORY_YEAR"
      - name: Verify Tushare official credential
        if: ${{ inputs.operation == 'archive' }}
        run: test -n "$TUSHARE_TOKEN" || { echo 'Missing TUSHARE_TOKEN'; exit 1; }
      - name: Fetch completed historical OHLCV to monthly ZSTD Parquet
        if: ${{ inputs.operation == 'archive' }}
        run: python -m value_screener.history_parquet --year "$HISTORY_YEAR" --out "artifacts/history-$HISTORY_YEAR"
      - name: Run engineering-only backtest smoke test on local export
        if: ${{ inputs.operation == 'archive' }}
        run: python -m value_screener.backtest_smoke --root "artifacts/history-$HISTORY_YEAR"
      - name: Upload private archive with remote per-file SHA-256 verification
        if: ${{ inputs.operation == 'archive' }}
        run: python -m value_screener.neon_archive upload --year "$HISTORY_YEAR" --root "artifacts/history-$HISTORY_YEAR"
      - name: Restore full Parquet archive and verify remote SHA-256
        if: ${{ inputs.operation == 'restore' }}
        run: python -m value_screener.neon_archive restore --year "$HISTORY_YEAR" --root "artifacts/history-$HISTORY_YEAR"
      - name: Verify restored Parquet can drive the backtest kernel
        if: ${{ inputs.operation == 'restore' }}
        run: python -m value_screener.backtest_smoke --root "artifacts/history-$HISTORY_YEAR"
      - name: Publish metadata-only validation manifest
        if: ${{ inputs.operation == 'archive' || inputs.operation == 'restore' }}
        uses: actions/upload-artifact@v4
        with:
          name: history-manifest-${{ env.HISTORY_YEAR }}-${{ inputs.operation }}
          path: artifacts/history-${{ env.HISTORY_YEAR }}/manifest.json
          if-no-files-found: error
          retention-days: 7
