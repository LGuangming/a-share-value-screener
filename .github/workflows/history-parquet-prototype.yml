name: A-Share 2025 Parquet History Prototype
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Completed historical calendar year; default 2025'
        default: '2025'
        type: string
permissions:
  contents: read
concurrency:
  group: a-share-backtest-history
  cancel-in-progress: false
jobs:
  parquet:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_API_SOURCE: official
      PYTHONPATH: backend
      HISTORY_YEAR: ${{ github.event_name == 'push' && '2025' || inputs.year || '2025' }}
      OBJECT_STORE_UPLOAD: ${{ vars.BACKTEST_ARCHIVE_UPLOAD || 'false' }}
      OBJECT_STORE_ENDPOINT: ${{ secrets.OBJECT_STORE_ENDPOINT }}
      OBJECT_STORE_BUCKET: ${{ secrets.OBJECT_STORE_BUCKET }}
      OBJECT_STORE_ACCESS_KEY: ${{ secrets.OBJECT_STORE_ACCESS_KEY }}
      OBJECT_STORE_SECRET_KEY: ${{ secrets.OBJECT_STORE_SECRET_KEY }}
      OBJECT_STORE_REGION: ${{ vars.OBJECT_STORE_REGION || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install history export dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install 'duckdb>=1.3,<2' 'boto3>=1.35,<2'
      - name: Verify Tushare credential
        run: test -n "$TUSHARE_TOKEN" || { echo 'Missing Tushare credential'; exit 1; }
      - name: Fetch full 2025 market daily OHLCV and validate compressed partitions
        run: python -m value_screener.history_parquet --year "$HISTORY_YEAR" --out "artifacts/history-$HISTORY_YEAR"
      - name: Real-price backtest kernel smoke test (engineering only)
        run: python -m value_screener.backtest_smoke --root "artifacts/history-$HISTORY_YEAR"
      - name: Publish temporary Parquet prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-parquet-${{ env.HISTORY_YEAR }}
          path: artifacts/history-${{ env.HISTORY_YEAR }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
