name: AKShare Experimental Test

on:
  workflow_dispatch:
    inputs:
      codes:
        description: '1-8 A-share codes separated by commas'
        required: false
        default: '000910,600051,002462'
        type: string
      mode:
        description: 'smoke = no database writes; publish = AKShare-only test snapshot'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - publish
  push:
    paths:
      - '.github/workflows/akshare-test.yml'

permissions:
  contents: read

concurrency:
  group: akshare-experimental
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: backend
      TEST_CODES: ${{ inputs.codes || '000910,600051,002462' }}
      TEST_MODE: ${{ inputs.mode || 'smoke' }}
      # Secret is only needed for manually selected publish mode.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-akshare.txt
      - name: Install AKShare experiment dependencies
        run: pip install -r backend/requirements-akshare.txt
      # AKShare has no dependency on the Tushare/Neon pipeline test suite.
      # The full 48-test suite is run independently in Tests and Build.
      - name: Run AKShare normalized-data unit tests
        run: python -m unittest discover -s backend/tests -p 'test_akshare.py' -v
      - name: Experimental live provider fetch (Eastmoney -> Tencent -> Sina; test-only)
        run: |
          if [ "$TEST_MODE" = publish ]; then
            test "${{ github.event_name }}" = workflow_dispatch || exit 1
            test -n "$DATABASE_URL" || { echo "DATABASE_URL secret missing"; exit 1; }
            python -m value_screener.akshare_test --codes "$TEST_CODES" --publish --output akshare-test-results.json
          else
            python -m value_screener.akshare_test --codes "$TEST_CODES" --output akshare-test-results.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akshare-test-results
          path: akshare-test-results.json
          if-no-files-found: warn
          retention-days: 7
