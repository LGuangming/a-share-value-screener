name: Manual Vercel Production Deploy

# This is deliberately a manual action: source changes never trigger releases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: value-radar-manual-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Request production release from Vercel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the private Vercel main-branch Deploy Hook
        shell: bash
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOOK_URL:-}" ]]; then
            echo "::error::Missing GitHub Actions secret VERCEL_DEPLOY_HOOK_URL. Configure it from Vercel Project Settings > Git > Deploy Hooks, then retry."
            exit 1
          fi
          # Reject other projects, cleartext URLs, or an accidental branch URL.
          if [[ ! "$DEPLOY_HOOK_URL" =~ ^https://api\.vercel\.com/v1/integrations/deploy/prj_XgjfTUJ6iImrNINA6hB5kdPDuM6W/[[:alnum:]_-]+(\?.*)?$ ]]; then
            echo "::error::Unexpected deploy hook URL. Use a production hook created for the a-share-value-screener project and main branch."
            exit 1
          fi
          response_file="$RUNNER_TEMP/vercel-deploy-hook-response.json"
          http_status="$(curl --silent --show-error --max-time 35 --request POST --output "$response_file" --write-out "%{http_code}" "$DEPLOY_HOOK_URL")"
          if [[ "$http_status" != "200" && "$http_status" != "201" && "$http_status" != "202" ]]; then
            echo "::error::Vercel did not accept the deployment request (HTTP $http_status). Check the deployment quota, hook status, and project settings."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          job = payload.get("job")
          if not isinstance(job, dict) or not isinstance(job.get("id"), str):
              raise SystemExit("Vercel did not return a valid deploy-hook job ID")
          print("VERCEL_DEPLOY_HOOK_ACCEPTED job_id=" + job["id"]
                + " state=" + str(job.get("state", "unknown")))
          print("The hook accepted the request; this is not a confirmation that the build is READY.")
          print("Verify the final deployment at:")
          print("https://vercel.com/lguangmings-projects/a-share-value-screener/deployments")
          PY
