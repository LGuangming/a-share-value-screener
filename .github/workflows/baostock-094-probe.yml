name: A-Share BaoStock 0.9.4 Connectivity Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/baostock-094-probe-20261124.txt'

permissions:
  contents: read

concurrency:
  group: a-share-historical-st-baostock
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BaoStock 0.9.4 only
        run: |
          python -m pip install 'baostock==0.9.4'
          python -m pip show baostock
      - name: Check DNS and TCP connectivity
        run: |
          python -u - <<'PY'
          import socket
          import time
          host, port = "public-api.baostock.com", 10030
          print(f"BAOSTOCK_DNS host={host}", flush=True)
          addresses = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
          print(f"BAOSTOCK_DNS status=ok address_count={len(addresses)}", flush=True)
          start = time.monotonic()
          try:
              with socket.create_connection((host, port), timeout=15):
                  print(f"BAOSTOCK_TCP status=ok elapsed={time.monotonic()-start:.2f}s", flush=True)
          except OSError as exc:
              print(f"BAOSTOCK_TCP status=failed error={type(exc).__name__} detail={exc}", flush=True)
              raise SystemExit(1)
          PY
      - name: Login once and verify historical daily isST
        run: |
          timeout --kill-after=5s 120s python -u - <<'PY'
          import importlib.metadata
          import socket
          import baostock as bs
          socket.setdefaulttimeout(20)
          print("BAOSTOCK_VERSION", importlib.metadata.version("baostock"), flush=True)
          lg = bs.login()
          print(f"BAOSTOCK_LOGIN code={lg.error_code} message={lg.error_msg}", flush=True)
          if lg.error_code != "0":
              raise SystemExit("Login failed; no retries")
          try:
              rs = bs.query_history_k_data_plus(
                  "sz.000001", "date,code,isST,tradestatus",
                  start_date="2025-01-02", end_date="2025-01-10",
                  frequency="d", adjustflag="3")
              print(f"BAOSTOCK_QUERY code={rs.error_code} message={rs.error_msg}", flush=True)
              if rs.error_code != "0":
                  raise SystemExit("Historical query failed")
              total = known = 0
              seen = set()
              while rs.next():
                  day, code, st, trading = rs.get_row_data()
                  if code != "sz.000001" or not "2025-01-02" <= day <= "2025-01-10" or day in seen:
                      raise SystemExit("Unexpected or duplicate historical key")
                  seen.add(day)
                  total += 1
                  known += int(st in ("0", "1"))
              if rs.error_code != "0" or total == 0 or known != total:
                  raise SystemExit("No complete usable ST observations")
              print(f"BAOSTOCK_ST_PROBE status=passed rows={total} usable={known}", flush=True)
          finally:
              bs.logout()
          PY
