name: GHCR reviewed integration test images
on:
  pull_request:
    paths:
      - '.github/workflows/ghcr-test-images.yml'
      - '.github/workflows/ghcr-reviewed-pair.yml'
      - 'docs/GHCR_TEST_IMAGES.md'
      - 'tests/ghcr_publish_pair.py'
      - 'tests/test_ghcr_publish_pair.py'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Enter PUBLISH-PR28-TEST or separately approved RECOVER-PR28-45741563355'
        required: true
        type: string
permissions:
  contents: read
env:
  REVIEWED_SHA: 1a87f659f6e83d9d92d8f04cba5f3891bc769507
  REVIEWED_RUN: '45633909294'
concurrency:
  group: ghcr-pr28-test-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  reviewed-pair:
    if: github.event_name != 'workflow_dispatch' || inputs.confirm == 'PUBLISH-PR28-TEST'
    uses: ./.github/workflows/ghcr-reviewed-pair.yml
    permissions:
      contents: read
      actions: read
    with:
      confirm: ${{ inputs.confirm || '' }}
  publish-test:
    name: Publish previously accepted private test pair (explicit dispatch only)
    needs: reviewed-pair
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'LGuangming/a-share-value-screener' && github.actor == 'LGuangming' && github.triggering_actor == 'LGuangming' && github.run_attempt == '1' && ((inputs.confirm == 'PUBLISH-PR28-TEST' && needs.reviewed-pair.result == 'success') || (inputs.confirm == 'RECOVER-PR28-45741563355' && needs.reviewed-pair.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: publisher-control
          persist-credentials: false
      - name: Confirm exact dispatch control checkout
        run: test "$(git -C publisher-control rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REVIEWED_SHA }}
          path: reviewed-source
          persist-credentials: false
      - name: Confirm exact reviewed checkout
        run: test "$(git -C reviewed-source rev-parse HEAD)" = "$REVIEWED_SHA"
      - name: Download only this dispatch attempt's accepted pair
        if: inputs.confirm == 'PUBLISH-PR28-TEST'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: accepted-pair-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted-pair
      - name: Validate and download pinned recovery artifact (no registry writes)
        if: inputs.confirm == 'RECOVER-PR28-45741563355'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45741563355" > "$RUNNER_TEMP/recovery-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45741563355/attempts/1/jobs?per_page=100" > "$RUNNER_TEMP/recovery-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15080908340" > "$RUNNER_TEMP/recovery-artifact.json"
          python3 publisher-control/tests/ghcr_publish_pair.py recovery-check
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15080908340/zip" > "$RUNNER_TEMP/recovery.zip"
          python3 publisher-control/tests/ghcr_publish_pair.py extract
          rm "$RUNNER_TEMP/recovery.zip"
      - name: Revalidate artifact, both image IDs and time-limited risk policy before any push
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          dir="$RUNNER_TEMP/accepted-pair"
          python3 publisher-control/tests/ghcr_publish_pair.py validate-files
          docker load -i "$dir/pair.tar.gz"
          for pair in 'web ashare-web:ci' 'minimal ashare-worker:minimal-eval'; do
            read -r kind image <<< "$pair"
            expected="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$dir/pair.json" "$kind")"
            test "$(docker image inspect "$image" --format '{{.Id}}')" = "$expected"
            test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVIEWED_SHA"
            if [[ "$kind" == web ]]; then
              test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 10001:10010
            else
              test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 10002:10010
            fi
          done
          for scan in minimal-trivy0700 minimal-trivy0762 web-trivy0762; do
            case "$scan" in minimal-*) kind=minimal; image=ashare-worker:minimal-eval ;; web-*) kind=web; image=ashare-web:ci ;; *) exit 1 ;; esac
            python3 reviewed-source/tests/candidate_vulnerability_gate.py --candidate "$kind" --image-id "$(docker image inspect "$image" --format '{{.Id}}')" --report "$dir/$scan-vuln.json" --decision "$RUNNER_TEMP/$scan-publish-decision.json"
          done
          echo "PASS: both exact images and all three risk decisions revalidated"
      - name: Push or recover accepted private pair and verify remote manifest bytes
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: python3 publisher-control/tests/ghcr_publish_pair.py publish
      - name: Preserve publication progress even on partial failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-progress-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-pair/publication-progress.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve complete pair release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-pair-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-pair/pair-release.json
          retention-days: 14
          if-no-files-found: error
