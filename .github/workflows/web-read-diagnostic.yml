name: A-Share Read-only Web Data Diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/web-read-diagnostic-20261123.txt'
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - run: python -m value_screener.diagnose_web_read
