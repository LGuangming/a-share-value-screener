name: A-Share Initial History Artifact Safety Cleanup
on:
  workflow_run:
    workflows:
      - A-Share 2025 Parquet History Prototype
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  remove-initial-public-raw-market-artifact:
    if: ${{ github.event.workflow_run.id == 45171163127 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove raw historical market data from initial public-repository artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 45171163127;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: runId, per_page: 100
            });
            for (const artifact of data.artifacts) {
              if (/^history-parquet-\d{4}$/.test(artifact.name)) {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id
                });
                core.info(`Removed raw market-data artifact ${artifact.name} from public repository`);
              }
            }
