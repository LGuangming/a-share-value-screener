name: A-Share Phase 2 Access Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/phase2-access-probe-20261123.txt'

permissions:
  contents: read

concurrency:
  group: a-share-backtest-history
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: backend
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_API_SOURCE: official
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check 11 historical market and financial interfaces
        run: python -m value_screener.phase2_probe
