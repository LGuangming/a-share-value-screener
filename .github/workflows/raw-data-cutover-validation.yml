name: A-Share Raw Data Cutover Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/raw-cutover-validate-20261124.txt'
permissions:
  contents: read
concurrency:
  group: a-share-backtest-history
  queue: max
  cancel-in-progress: false
env:
  PYTHONPATH: backend
  NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
  NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
  NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
  NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
  NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
  NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}
jobs:
  verify-new-namespace:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dataset: [daily_prices, adj_factor, daily_basic, stk_limit, suspend_d, stock_basic, financial, disclosures, historical_st, backtest]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private archive dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install 'boto3>=1.35,<2' 'duckdb>=1.3,<2'
      - name: Verify new namespace data or engineering backtest
        env:
          DATASET: ${{ matrix.dataset }}
        run: python -m value_screener.raw_cutover_check --group "$DATASET"
