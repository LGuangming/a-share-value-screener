name: A-Share Backtest Data Permission Probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a-share-data-pipeline
  queue: max
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_API_SOURCE: official
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify official API credential configured
        run: test -n "$TUSHARE_TOKEN" || { echo 'TUSHARE_TOKEN not set'; exit 1; }
      - name: Probe backtest dataset entitlements (read-only; no database)
        run: python -m value_screener.probe_backtest_permissions
