name: A-Share Daily Net-Net Scan
on:
  schedule:
    # 19:30 China Standard Time, Monday-Friday (11:30 UTC).
    # Non-trading days are checked against Tushare's SSE calendar.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Optional Asia/Shanghai session date: YYYY-MM-DD'
        required: false
        type: string
      financial_budget:
        description: 'Companies to refresh (each requires 3 financial API calls)'
        required: false
        default: '30'
        type: string
      api_source:
        description: 'official: HTTPS original; relay: third-party HTTP, token sent unencrypted'
        required: false
        default: official
        type: choice
        options:
          - official
          - relay
      check_api_only:
        description: 'Check trade_cal and stock_basic only (no database writes)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: a-share-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_RELAY_TOKEN: ${{ secrets.TUSHARE_RELAY_TOKEN }}
      TUSHARE_API_SOURCE: ${{ inputs.api_source || 'official' }}
      TUSHARE_RELAY_URL: ${{ vars.TUSHARE_RELAY_URL || 'http://tus.sxdata.top/tu_share/' }}
      TUSHARE_ALLOW_HTTP: ${{ inputs.api_source == 'relay' && '1' || '0' }}
      CHECK_API_ONLY: ${{ inputs.check_api_only || 'false' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify selected API credentials
        run: |
          if [ "$TUSHARE_API_SOURCE" = "relay" ]; then
            test -n "$TUSHARE_RELAY_TOKEN" || { echo 'TUSHARE_RELAY_TOKEN secret is missing'; exit 1; }
            echo 'Selected relay mode: third-party HTTP may expose its token in transit.'
          else
            test -n "$TUSHARE_TOKEN" || { echo 'TUSHARE_TOKEN secret is missing'; exit 1; }
          fi
          if [ "$CHECK_API_ONLY" != "true" ]; then
            test -n "$DATABASE_URL" || { echo 'DATABASE_URL secret is missing'; exit 1; }
          fi
      - name: Check API or scan and publish snapshot
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          FINANCIAL_BUDGET: ${{ inputs.financial_budget || '30' }}
        run: |
          if [ "$CHECK_API_ONLY" = "true" ]; then
            if [ -n "$TRADE_DATE" ]; then
              python -m value_screener.cli check-api --date "$TRADE_DATE"
            else
              python -m value_screener.cli check-api
            fi
          elif [ -n "$TRADE_DATE" ]; then
            python -m value_screener.cli scan --date "$TRADE_DATE" --financial-budget "$FINANCIAL_BUDGET"
          else
            python -m value_screener.cli scan --financial-budget "$FINANCIAL_BUDGET"
          fi
