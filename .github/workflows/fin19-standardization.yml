name: FIN19 offline standardization
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/fin19_standardize.py
      - tests/test_fin19_standardize.py
      - .github/workflows/fin19-standardization.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p test_fin19_standardize.py -v
