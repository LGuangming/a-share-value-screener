name: A-Share 2025-2020 Sequential Private Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/one-shot/archive-2025-2020-trigger.txt'

permissions:
  contents: read

concurrency:
  group: a-share-backtest-history
  cancel-in-progress: false

jobs:
  archive-six-years:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: backend
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_API_SOURCE: official
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validated archive dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install 'duckdb>=1.3,<2' 'boto3>=1.35,<2'

      - name: Archive each completed calendar year in descending order
        run: python -m value_screener.history_batch_archive --start-year 2025 --end-year 2020

      - name: Keep non-price metadata manifests for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-2025-2020-manifests
          path: artifacts/manifests/*.json
          if-no-files-found: warn
          retention-days: 30
