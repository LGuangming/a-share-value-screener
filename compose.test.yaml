# CI-only overlay; never use with real data, credentials or network names.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fixture_admin
      POSTGRES_PASSWORD: fixture_only
      POSTGRES_DB: ashare_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture_admin -d ashare_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      database:
        aliases: ["postgres"]
  web:
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3198:3000"
  worker:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./tests/fixtures
        target: /fixtures
        read_only: true
        bind:
          create_host_path: false
