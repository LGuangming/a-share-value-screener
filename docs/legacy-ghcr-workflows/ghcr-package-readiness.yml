name: GHCR package readiness (read only)
on:
  push:
    branches:
      - feature/ghcr-readiness-diagnostic
    paths:
      - '.github/workflows/ghcr-package-readiness.yml'
  workflow_dispatch:
permissions:
  packages: read
jobs:
  package-readiness:
    name: Inspect both private packages with repository read token
    if: github.repository == 'LGuangming/a-share-value-screener' && ((github.event_name == 'push' && github.ref == 'refs/heads/feature/ghcr-readiness-diagnostic') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query only package metadata and version listing (GET)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, sys
          import urllib.error, urllib.request

          owner = "lguangming"
          repo = "lguangming/a-share-value-screener"
          names = [
              "a-share-value-screener-web-test-pr28",
              "a-share-value-screener-worker-test-pr28",
          ]
          root = "https://api.github.com/users/" + owner + "/packages/container/"
          # Do not follow redirects or disclose the bearer token or raw API bodies.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())

          def get_json(url):
              req = urllib.request.Request(url, method="GET", headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ashare-ghcr-readiness",
              })
              try:
                  with opener.open(req, timeout=20) as res:
                      body = res.read(2_000_001)
                      if len(body) > 2_000_000:
                          return res.status, None, "response_too_large"
                      try:
                          return res.status, json.loads(body), None
                      except (ValueError, UnicodeError):
                          return res.status, None, "invalid_json"
              except urllib.error.HTTPError as err:
                  return err.code, None, {
                      401: "authentication_failed",
                      403: "forbidden_or_rate_limited",
                      404: "missing_or_inaccessible",
                      429: "rate_limited",
                  }.get(err.code, "unexpected_http_status")
              except (OSError, ValueError):
                  return None, None, "network_or_protocol_error"

          def inspect(name):
              url = root + name
              status, body, error = get_json(url)
              out = {
                  "package": name, "metadata_http": status,
                  "metadata_error": error, "exists": "unconfirmed",
                  "visibility": "unconfirmed", "linked_repository": None,
                  "linked_to_expected_repo": "unconfirmed",
                  "version_count": None, "versions_http": None,
                  "versions_error": None, "repository_token_read": "unconfirmed",
                  "repository_actions_write": "not_tested",
                  "readiness": "blocked",
              }
              if status != 200 or not isinstance(body, dict):
                  return out
              owner_data = body.get("owner")
              if (body.get("name") != name or body.get("package_type") != "container"
                  or not isinstance(owner_data, dict)
                  or str(owner_data.get("login", "")).lower() != owner
                  or not isinstance(body.get("id"), int)):
                  out["metadata_error"] = "unexpected_package_identity"
                  return out
              out["exists"] = "confirmed"
              visibility = body.get("visibility")
              if visibility in ("private", "public", "internal"):
                  out["visibility"] = visibility
              linked = body.get("repository")
              if isinstance(linked, dict) and isinstance(linked.get("full_name"), str):
                  out["linked_repository"] = linked["full_name"]
                  out["linked_to_expected_repo"] = linked["full_name"].lower() == repo
              count = body.get("version_count")
              if isinstance(count, int) and count >= 0:
                  out["version_count"] = count
              s, versions, e = get_json(url + "/versions?per_page=1")
              out["versions_http"], out["versions_error"] = s, e
              if s == 200 and isinstance(versions, list):
                  out["repository_token_read"] = "metadata_and_versions_confirmed"
                  if visibility == "private":
                      out["readiness"] = "private_read_confirmed_write_unverified"
              elif s == 200:
                  out["versions_error"] = e or "unexpected_versions_response"
              return out

          results = [inspect(name) for name in names]
          ready = all(p["readiness"] == "private_read_confirmed_write_unverified"
                      for p in results)
          report = {
              "schema_version": 1,
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"],
              "token_permissions": "packages:read",
              "both_private_and_readable": ready,
              "write_permission_verified": False,
              "publication_authorized": False,
              "packages": results,
          }
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ghcr-readiness.json"
          target.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## GHCR read-only readiness\n\n")
              f.write("| Package | Metadata HTTP | Visibility | Versions HTTP | Result |\n")
              f.write("|---|---:|---|---:|---|\n")
              for p in results:
                  f.write("| {package} | {metadata_http} | {visibility} | {versions_http} | {readiness} |\n".format(**p))
              f.write("\nWrite access remains unverified. No package mutation or publication. "
                      "404 is ambiguous (missing or inaccessible). Linked repository is not the Actions access role.\n")
          if not ready:
              print("BLOCK: both packages were not confirmed private and readable")
              sys.exit(1)
          print("PASS: both packages private and readable; write access remains unverified")
          PY
      - name: Preserve sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghcr-readiness-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-readiness.json
          retention-days: 14
          if-no-files-found: error
