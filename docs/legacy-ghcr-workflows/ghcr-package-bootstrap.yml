name: GHCR private package verification (manual read only)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Enter VERIFY-PRIVATE-GHCR after owner-local seed and UI permission review'
        required: true
        type: string
      owner_confirmed_access:
        description: 'Both packages Private, independent access and expected Actions Write/Admin reviewed'
        required: true
        type: boolean
        default: false
      web_digest:
        description: 'Exact Web bootstrap marker sha256 digest from owner receipt'
        required: true
        type: string
      worker_digest:
        description: 'Exact Worker bootstrap marker sha256 digest from owner receipt'
        required: true
        type: string
permissions: {}
concurrency:
  group: ghcr-pr28-test-workflow_dispatch
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'LGuangming/a-share-value-screener' && github.actor == 'LGuangming' && github.triggering_actor == 'LGuangming' && inputs.confirm == 'VERIFY-PRIVATE-GHCR' && inputs.owner_confirmed_access == true && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact main dispatch checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify both linked private bootstrap markers (no writes)
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          OWNER_CONFIRMED_ACCESS: ${{ inputs.owner_confirmed_access }}
          WEB_DIGEST: ${{ inputs.web_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: python3 tests/ghcr_private_bootstrap.py verify
      - name: Preserve sanitized verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghcr-bootstrap-verify-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-bootstrap.json
          retention-days: 14
          if-no-files-found: error
