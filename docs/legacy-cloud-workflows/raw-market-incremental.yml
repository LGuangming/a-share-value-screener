name: A-Share Raw Market Incremental Archive
on:
  workflow_run:
    workflows: [A-Share Market Data Refresh]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill_2026:
        description: Backfill all completed 2026 sessions (newest month first)
        type: boolean
        default: false
      start_date:
        description: Optional first date YYYY-MM-DD (max 31 calendar days)
        type: string
      end_date:
        description: Optional last date YYYY-MM-DD
        type: string
  push:
    branches: [main]
    paths:
      - '.github/one-shot/raw-incremental-start-20261124.txt'
      - '.github/one-shot/raw-2026-backfill-20261124.txt'
permissions:
  contents: read
concurrency:
  group: a-share-data-pipeline
  queue: max
  cancel-in-progress: false
jobs:
  archive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: backend
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_PRIVATE_CONFIRMED: ${{ vars.NEON_STORAGE_PRIVATE_CONFIRMED || 'false' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_API_SOURCE: official
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      BACKFILL_2026: ${{ inputs.backfill_2026 || (github.event_name == 'push' && 'true') || 'false' }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test archive dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install 'boto3>=1.35,<2' 'duckdb>=1.3,<2'
          python -m unittest discover -s backend/tests -p test_raw_incremental.py -v
      - name: Archive actual successful trading date or bounded historical range
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TRIGGER_RUN_ID" ]; then
            args+=(--trigger-run-id "$TRIGGER_RUN_ID")
          elif [ "$BACKFILL_2026" = "true" ]; then
            args+=(--backfill-2026)
          elif [ -n "$START_DATE" ] || [ -n "$END_DATE" ]; then
            args+=(--start-date "$START_DATE" --end-date "$END_DATE")
          fi
          python -m value_screener.raw_incremental "${args[@]}"
